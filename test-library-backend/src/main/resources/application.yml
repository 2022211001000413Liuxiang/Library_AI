server:
  port: 8081

spring:
  application:
    name: library-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 111111

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# CORS 配置
cors:
  allowed-origins: http://localhost:8080

# 阿里云 OSS 配置（使用环境变量）
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:liuxiang1234}

# AI 配置（使用环境变量）
ai:
  provider: ${AI_PROVIDER:qwen}
  api-key: ${AI_API_KEY:sk-7992a7d9248d4cb0b9148d88a76f9e30}
  model: ${AI_MODEL:qwen-turbo}
  endpoint: ${AI_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1}